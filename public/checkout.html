<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO2Reforest — Revisa tu pedido</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .cart-summary { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-bottom: 30px; }
    .pack-line { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eaeaea; flex-wrap: wrap; }
    .pack-name { font-weight: 600; color: var(--green); }
    .total-grande { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--gold); }
    .btn-pago { background: var(--gold); color: #fff; border: none; cursor: pointer; padding: 14px 30px; border-radius: 7px; font-weight: 700; transition: all .25s; width: 100%; max-width: 320px; }
    .btn-pago:hover { background: #b57c1a; }
    .btn-pago:disabled { background: #ccc; cursor: not-allowed; }
    .btn-s { text-decoration: none; color: #666; padding: 14px 20px; display: inline-block; }
    .cliente-info { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-top: 20px; border-left: 4px solid var(--gold); }
    .cliente-info p { margin: 6px 0; }
  </style>
</head>
<body>

<nav>
  <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMjAgNTYiPgogIDxyZWN0IHg9IjgiIHk9IjI4IiB3aWR0aD0iNSIgaGVpZ2h0PSIxOCIgcng9IjIuNSIgZmlsbD0iIzFBNEEyRSIvPgogIDxlbGxpcHNlIGN4PSIxMC41IiBjeT0iMjQiIHJ4PSIyIiByeT0iMTUiIGZpbGw9IiMyRDdBNEYiIHRyYW5zZm9ybT0icm90YXRlKC00MiAxMC41IDI0KSIvPgogIDxlbGxpcHNlIGN4PSIxMC41IiBjeT0iMjQiIHJ4PSIyIiByeT0iMTUiIGZpbGw9IiM0Q0FGN0QiIHRyYW5zZm9ybT0icm90YXRlKC0xOCAxMC41IDI0KSIvPgogIDxlbGxpcHNlIGN4PSIxMC41IiBjeT0iMjQiIHJ4PSIyIiByeT0iMTUiIGZpbGw9IiMyRDdBNEYiIHRyYW5zZm9ybT0icm90YXRlKC02IDEwLjUgMjQpIi8+CiAg" alt="CO2Reforest" class="nav-logo">
</nav>

<section class="sec" style="padding-top: 120px;">
  <div class="wrap">
    <p class="sec-tag">Paso final</p>
    <h2 class="sec-title">Revisa tu pedido y completa el pago</h2>
    
    <div class="cart-summary" id="cart-summary">
      <div style="text-align:center; padding: 40px;">Cargando tu pedido...</div>
    </div>

    <div id="cliente-info-container" class="cliente-info" style="display: none;">
      <h3 style="margin:0 0 8px 0;">🧑‍💼 Datos del comprador</h3>
      <p><strong>Nombre:</strong> <span id="cliente-nombre"></span></p>
      <p><strong>Correo:</strong> <span id="cliente-email"></span></p>
      <p><strong>Dirección:</strong> <span id="cliente-direccion"></span></p>
      <p class="tb-note" style="margin-top: 10px;">El comprobante de pago y el certificado serán enviados a este correo.</p>
    </div>
    
    <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px; align-items: center; flex-wrap: wrap;">
      <a href="form.html" class="btn-s">← Volver a la calculadora</a>
      <button id="confirmar-pago" class="btn-pago">Confirmar y pagar con Wompi</button>
    </div>
  </div>
</section>

<script>
  const PLACA_COST = 85000;
  const PACKS = {
    a: { name: 'Pack A — Bosque Llanero', price: 180000, co2: 213, especies: '2 Moriches + Saladillo + Yopo + Cañofistol' },
    b: { name: 'Pack B — Galería Riparia', price: 186000, co2: 243, especies: '2 Moriches + Saladillo + Cañofistol + Orejero' },
    c: { name: 'Pack C — Silvopastoril', price: 198000, co2: 228, especies: 'Moriche + Saladillo + Yopo + Cañofistol + Aceite' }
  };

  let cart = { a: 0, b: 0, c: 0, placa: false, cliente: { nombre: '', email: '', direccion: '' } };

  function loadCart() {
    const raw = localStorage.getItem('co2reforest_cart');
    if (!raw) {
      document.getElementById('cart-summary').innerHTML = '<div style="text-align:center; padding: 40px;">No hay ningún pedido pendiente. <a href="form.html">Regresa a la calculadora</a></div>';
      return false;
    }
    try {
      const data = JSON.parse(raw);
      cart = { 
        a: parseInt(data.a) || 0, 
        b: parseInt(data.b) || 0, 
        c: parseInt(data.c) || 0, 
        placa: !!data.placa,
        cliente: data.cliente || { nombre: '', email: '', direccion: '' }
      };
      console.log("Carrito cargado:", cart);
      return true;
    } catch(e) { 
      console.error("Error al cargar carrito:", e);
      return false; 
    }
  }

  function renderSummary() {
    const subtotal = cart.a * PACKS.a.price + cart.b * PACKS.b.price + cart.c * PACKS.c.price;
    const totalGroups = cart.a + cart.b + cart.c;
    let discountPercent = 0;
    if (totalGroups >= 200) discountPercent = 20;
    else if (totalGroups >= 100) discountPercent = 10;
    else discountPercent = Math.min(Math.floor(totalGroups / 10), 20);
    
    const discountAmount = Math.round(subtotal * discountPercent / 100);
    let total = subtotal - discountAmount;
    let placaHtml = '';
    
    if (cart.placa) {
      total += PLACA_COST;
      placaHtml = `<div class="pack-line"><span class="pack-name">🪧 Placa personalizada</span><span>+ $${PLACA_COST.toLocaleString('es-CO')}</span></div>`;
    }

    let packsHtml = '';
    if (cart.a > 0) packsHtml += `<div class="pack-line"><span class="pack-name">${PACKS.a.name} × ${cart.a}</span><span>$${(cart.a * PACKS.a.price).toLocaleString('es-CO')}</span></div>`;
    if (cart.b > 0) packsHtml += `<div class="pack-line"><span class="pack-name">${PACKS.b.name} × ${cart.b}</span><span>$${(cart.b * PACKS.b.price).toLocaleString('es-CO')}</span></div>`;
    if (cart.c > 0) packsHtml += `<div class="pack-line"><span class="pack-name">${PACKS.c.name} × ${cart.c}</span><span>$${(cart.c * PACKS.c.price).toLocaleString('es-CO')}</span></div>`;

    const summaryHtml = `
      <div style="margin-bottom: 20px;">
        <h3 style="font-family:'Playfair Display'; margin-bottom: 15px;">🌱 Árboles que vas a plantar</h3>
        ${packsHtml}
        <div class="pack-line"><span class="pack-name">Subtotal</span><span>$${subtotal.toLocaleString('es-CO')}</span></div>
        <div class="pack-line"><span class="pack-name">Descuento por volumen (${discountPercent}%)</span><span style="color:#c8972b;">−$${discountAmount.toLocaleString('es-CO')}</span></div>
        ${placaHtml}
        <div class="pack-line" style="border-top: 2px solid #c8972b; margin-top: 10px; padding-top: 15px;"><span class="pack-name" style="font-size:1.2rem;">Total a pagar</span><span class="total-grande">$${total.toLocaleString('es-CO')}</span></div>
      </div>
    `;
    document.getElementById('cart-summary').innerHTML = summaryHtml;

    if (cart.cliente && cart.cliente.nombre) {
      document.getElementById('cliente-nombre').innerText = cart.cliente.nombre;
      document.getElementById('cliente-email').innerText = cart.cliente.email;
      document.getElementById('cliente-direccion').innerText = cart.cliente.direccion || 'No especificada';
      document.getElementById('cliente-info-container').style.display = 'block';
    }
  }

  async function iniciarPago() {
    const btn = document.getElementById('confirmar-pago');
    btn.disabled = true;
    btn.textContent = 'Abriendo pasarela...';

    try {
      const apiUrl = '/api/create-payment';
      const payload = { 
        a: cart.a, 
        b: cart.b, 
        c: cart.c, 
        placa: cart.placa,
        textoPlaca: cart.cliente.textoPlaca || '',
        cliente: cart.cliente
      };
      
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const data = await response.json();
      
      if (!response.ok || !data.signature) {
        throw new Error(data.error || 'Error al validar la firma desde el servidor');
      }

      const form = document.createElement('form');
      form.method = 'GET';
      form.action = 'https://checkout.wompi.co/p/';
      form.target = '_self'; 

      const addField = (name, value) => {
        if (value) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        }
      };

      addField('public-key', data.publicKey);
      addField('currency', data.currency);
      addField('amount-in-cents', data.amountInCents); 
      addField('reference', data.reference);
      addField('signature:integrity', data.signature);
      addField('redirect-url', data.redirectUrl);

      document.body.appendChild(form);
      form.submit();

    } catch (err) {
      console.error("❌ Error en iniciarPago:", err);
      alert('Error de integración: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Confirmar y pagar con Wompi';
    }
  }

  if (loadCart()) {
    renderSummary();
    const btn = document.getElementById('confirmar-pago');
    if (btn) btn.addEventListener('click', iniciarPago);
  } else {
    const btn = document.getElementById('confirmar-pago');
    if (btn) btn.style.display = 'none';
  }
</script>
</body>
</html>
