<section class="sec" style="padding-top: 120px;">
  <div class="wrap">
    <p class="sec-tag">Paso final</p>
    <h2 class="sec-title">Revisa tu pedido y completa el pago</h2>
    <div class="cart-summary" id="cart-summary">
      <div style="text-align:center; padding: 40px;">Cargando tu pedido...</div>
    </div>
    <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
      <a href="form.html" class="btn-s">← Volver al formulario</a>
      <button id="confirmar-pago" class="btn-p btn-pago">Confirmar y pagar con Wompi</button>
    </div>
  </div>
</section>

<script src="https://checkout.wompi.co/widget.js"></script>
<script>
  const PLACA_COST = 85000;
  const PACKS = {
    a: { name: 'Pack A — Bosque Llanero', price: 180000, co2: 213, especies: '2 Moriches + Saladillo + Yopo + Cañofistol' },
    b: { name: 'Pack B — Galería Riparia', price: 186000, co2: 243, especies: '2 Moriches + Saladillo + Cañofistol + Orejero' },
    c: { name: 'Pack C — Silvopastoril', price: 198000, co2: 228, especies: 'Moriche + Saladillo + Yopo + Cañofistol + Aceite' }
  };

  let cart = { a: 0, b: 0, c: 0, placa: false, area: '', cliente: null };

  function loadCart() {
    const raw = localStorage.getItem('co2reforest_cart');
    if (!raw) {
      document.getElementById('cart-summary').innerHTML = '<div style="text-align:center; padding: 40px;">No hay ningún pedido pendiente. <a href="form.html">Regresa al formulario</a></div>';
      return false;
    }
    try {
      const data = JSON.parse(raw);
      cart = { 
        a: data.a || 0, 
        b: data.b || 0, 
        c: data.c || 0, 
        placa: data.placa || false,
        area: data.area || '',
        cliente: data.cliente || null
      };
      return true;
    } catch(e) { return false; }
  }

  function renderSummary() {
    const subtotal = cart.a * PACKS.a.price + cart.b * PACKS.b.price + cart.c * PACKS.c.price;
    const totalGroups = cart.a + cart.b + cart.c;
    const discountPercent = Math.min(Math.floor(totalGroups / 10), 20);
    const discountAmount = Math.round(subtotal * discountPercent / 100);
    let total = subtotal - discountAmount;
    let placaHtml = '';
    if (cart.placa) {
      total += PLACA_COST;
      placaHtml = `<div class="pack-line"><span class="pack-name">🪧 Placa personalizada</span><span>+ $${PLACA_COST.toLocaleString('es-CO')}</span></div>`;
    }

    let packsHtml = '';
    if (cart.a > 0) packsHtml += `<div class="pack-line"><span class="pack-name">${PACKS.a.name} × ${cart.a}</span><span>$${(cart.a * PACKS.a.price).toLocaleString('es-CO')}</span><div style="font-size:0.75rem; color:#4a6a4a; width:100%;">${PACKS.a.especies}</div></div>`;
    if (cart.b > 0) packsHtml += `<div class="pack-line"><span class="pack-name">${PACKS.b.name} × ${cart.b}</span><span>$${(cart.b * PACKS.b.price).toLocaleString('es-CO')}</span><div style="font-size:0.75rem; color:#4a6a4a; width:100%;">${PACKS.b.especies}</div></div>`;
    if (cart.c > 0) packsHtml += `<div class="pack-line"><span class="pack-name">${PACKS.c.name} × ${cart.c}</span><span>$${(cart.c * PACKS.c.price).toLocaleString('es-CO')}</span><div style="font-size:0.75rem; color:#4a6a4a; width:100%;">${PACKS.c.especies}</div></div>`;

    const summaryHtml = `
      <div style="margin-bottom: 20px;">
        <h3 style="font-family:'Playfair Display'; margin-bottom: 15px;">🌱 Árboles que vas a plantar</h3>
        ${packsHtml}
        <div class="pack-line"><span class="pack-name">Área de vida seleccionada</span><span><strong>${cart.area}</strong></span></div>
        <div class="pack-line"><span class="pack-name">Subtotal</span><span>$${subtotal.toLocaleString('es-CO')}</span></div>
        <div class="pack-line"><span class="pack-name">Descuento por volumen (${discountPercent}%)</span><span class="rv disc">−$${discountAmount.toLocaleString('es-CO')}</span></div>
        ${placaHtml}
        <div class="pack-line" style="border-top: 2px solid #c8972b; margin-top: 10px; padding-top: 15px;"><span class="pack-name" style="font-size:1.2rem;">Total a pagar</span><span class="total-grande">$${total.toLocaleString('es-CO')}</span></div>
      </div>
      <div class="res-banner" style="margin-top: 20px;">
        <div class="res-icon">🌳</div>
        <div>
          <div class="res-title">Total de árboles: ${totalGroups * 5}</div>
          <div class="res-text">Grupos: ${totalGroups} | CO₂ capturado/año: ${(cart.a*213 + cart.b*243 + cart.c*228).toLocaleString()} kg</div>
        </div>
      </div>
    `;
    document.getElementById('cart-summary').innerHTML = summaryHtml;
  }

  async function iniciarPago() {
    const btn = document.getElementById('confirmar-pago');
    btn.disabled = true;
    btn.textContent = 'Preparando pago...';

    try {
      const response = await fetch('/api/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          a: cart.a, 
          b: cart.b, 
          c: cart.c, 
          placa: cart.placa,
          area: cart.area,
          cliente: cart.cliente
        })
      });
      const data = await response.json();
      if (!response.ok || !data.signature) throw new Error(data.error || 'Error al preparar el pago');

      const form = document.createElement('form');
      form.method = 'GET';
      form.action = 'https://checkout.wompi.co/p/';
      form.target = '_self';
      const addField = (name, value) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
      };
      addField('public-key', data.publicKey);
      addField('currency', data.currency);
      addField('amount-in-cents', data.amountInCents);
      addField('reference', data.reference);
      addField('signature:integrity', data.signature);
      addField('redirect-url', data.redirectUrl);
      document.body.appendChild(form);
      form.submit();
    } catch (err) {
      alert('Error al conectar con el servidor: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Confirmar y pagar con Wompi';
    }
  }

  if (loadCart()) {
    renderSummary();
    document.getElementById('confirmar-pago').addEventListener('click', iniciarPago);
  } else {
    document.getElementById('confirmar-pago').style.display = 'none';
  }
</script>
</body>
